# Configuracao central da suite.
# Precedencia de leitura (ver TestConfig): -Dchave > variavel de ambiente > este arquivo > default.
# Nenhum valor aqui e segredo: a aplicacao-alvo e publica e estatica.

base.url=https://playwrightlab.github.io/

# chromium | firefox | webkit
browser=chromium
headless=true

# Perfil de viewport usado pelo BrowserContext: desktop | mobile
viewport=desktop
viewport.desktop.width=1280
viewport.desktop.height=720
viewport.mobile.width=390
viewport.mobile.height=844

# Tetos de espera por condicao observavel (nao sao esperas fixas).
# O dropdown assincrono do PlayLab resolve em ~2s medidos; a folga cobre CI lento.
timeout.action.ms=10000
timeout.assertion.ms=10000
